<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Nazarana</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f3ec;
      color: #241c18;
      font-family: "DM Sans", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .box {
      width: 100%;
      max-width: 470px;

      background: #fffdf9;
      border: 1px solid #ded4c8;

      padding: 48px;
    }

    .brand {
      font-family: "Italiana", serif;
      font-size: 28px;
      letter-spacing: 5px;
      margin-bottom: 7px;
    }

    .tagline {
      font-size: 9px;
      letter-spacing: 2px;
      color: #80746b;
      margin-bottom: 55px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a7864f;
      margin-bottom: 14px;
    }

    h1 {
      font-family: "Italiana", serif;
      font-weight: 400;
      font-size: 40px;
      margin: 0 0 14px;
    }

    .intro {
      color: #80746b;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 52px;

      border: 1px solid #d9d0c4;
      background: white;

      padding: 0 14px;
      font: inherit;

      outline: none;
    }

    input:focus {
      border-color: #651828;
    }

    button {
      width: 100%;
      height: 54px;

      border: 0;
      background: #651828;
      color: white;

      cursor: pointer;

      font: inherit;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 18px;

      font-size: 12px;
      line-height: 1.6;
    }

    .error {
      color: #9c2f3f;
    }

    .success {
      color: #496653;
    }

    @media (max-width: 550px) {
      body {
        padding: 18px;
      }

      .box {
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="brand">
      NAZARANA
    </div>

    <div class="tagline">
      AN OFFERING WITH LOVE AND RESPECT
    </div>

    <div class="eyebrow">
      Corporate Gifting
    </div>

    <h1>Create new password</h1>

    <p class="intro">
      Choose a new password for your Nazarana corporate account.
    </p>

    <form id="resetForm">

      <div class="field">

        <label for="password">
          New password
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirm new password
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

      </div>


      <button
        id="resetButton"
        type="submit">
        Update Password
      </button>

      <div id="message"></div>

    </form>

  </main>


<script type="module">

  import {
    createClient
  } from "https://esm.sh/@supabase/supabase-js@2";


  const SUPABASE_URL =
    "https://seogmslimxytpeoynath.supabase.co";


  const SUPABASE_ANON_KEY =
    "sb_publishable_MpiriYPS7XgmYaeg_kU5gg_hULjj2wq";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  const form =
    document.getElementById(
      "resetForm"
    );

  const message =
    document.getElementById(
      "message"
    );

  const button =
    document.getElementById(
      "resetButton"
    );


  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      message.textContent = "";
      message.className = "";

      const password =
        document.getElementById(
          "password"
        ).value;

      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        ).value;


      if (password.length < 8) {

        message.textContent =
          "Password must contain at least 8 characters.";

        message.className =
          "error";

        return;
      }


      if (
        password !==
        confirmPassword
      ) {

        message.textContent =
          "The passwords do not match.";

        message.className =
          "error";

        return;
      }


      button.disabled = true;

      button.textContent =
        "Updating…";


      const {
        error
      } =
        await supabase.auth
          .updateUser({
            password:
              password
          });


      if (error) {

        message.textContent =
          error.message;

        message.className =
          "error";

        button.disabled = false;

        button.textContent =
          "Update Password";

        return;
      }


      message.textContent =
        "Password updated successfully. Redirecting to HR login…";

      message.className =
        "success";


      await supabase.auth.signOut();


      setTimeout(
        () => {

          location.href =
            "hr-login.html";

        },
        1500
      );

    }
  );

</script>

</body>
</html>
